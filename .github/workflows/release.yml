# Builds SoulsOverlay.exe and publishes it on the Releases page.
# Push a tag matching the version in pyproject.toml to release, e.g.
#   git tag v1.0.0 && git push origin v1.0.0
# "Run workflow" on the Actions tab builds the exe without releasing it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write      # create the release
  id-token: write      # build attestation
  attestations: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"; exit 1
          fi

      - name: Install Python packages
        run: pip install ".[hotkeys,launcher]" pyinstaller

      - name: Get Tesseract (only English, only tesseract.exe and its DLLs)
        shell: bash
        run: |
          choco install tesseract -y --no-progress
          mkdir -p build
          cp -r "/c/Program Files/Tesseract-OCR" build/tesseract
          cd build/tesseract
          find . -maxdepth 1 -name "*.exe" ! -name "tesseract.exe" -delete
          rm -rf doc
          find tessdata -maxdepth 1 -name "*.traineddata" ! -name "eng.traineddata" ! -name "osd.traineddata" -delete
          curl -fsSL -o LICENSE https://raw.githubusercontent.com/tesseract-ocr/tesseract/main/LICENSE

      - name: Build SoulsOverlay.exe
        run: pyinstaller --noconfirm packaging/soulsoverlay.spec

      - name: Smoke test (the packed Tesseract reads a boss name)
        shell: bash
        run: |
          dist/SoulsOverlay.exe --version
          dist/SoulsOverlay.exe analyze tests/fixtures/er_morgott_full_1080p.jpg | tee analyze.json
          grep -q '"boss": "Morgott, the Omen King"' analyze.json

      - name: Checksum
        shell: bash
        run: cd dist && sha256sum SoulsOverlay.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SoulsOverlay
          path: dist/

      - name: Build attestation (lets anyone check the exe was built here)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        continue-on-error: true   # needs a public repo on free plans
        with:
          subject-path: dist/SoulsOverlay.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: packaging/RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist/SoulsOverlay.exe
            dist/SHA256SUMS.txt
